const notebookAccess=new URLSearchParams(location.hash.slice(1)).get('key')??'';
async function notebookApi(path,options={}){
 const endpoint=notebookConfig.url+'/rest/v1/';
 const headers={apikey:notebookConfig.key,'Content-Type':'application/json'};
 if(notebookAccess)headers['x-vocab-key']=notebookAccess;
 const send=(url,opts={})=>fetch(endpoint+url,{...opts,headers:{...headers,...opts.headers},cache:'no-store',signal:AbortSignal.timeout(15000)});
 if(path==='/cards.json'){
  const all=[];for(let offset=0;offset<50000;offset+=500){const r=await send('vocab_cards?select=id,term,meaning,example,translation,note,lessons&order=sort_order.asc,id.asc&limit=500&offset='+offset);if(!r.ok)return r;const rows=await r.json();all.push(...rows);if(rows.length<500)return Response.json(all);}return Response.json({error:'カード数が上限を超えました。'},{status:413});
 }
 if(path!=='/api/reviews')return Response.json({error:'Not found'},{status:404});
 if(!notebookAccess)return Response.json({error:'アクセスキーがありません。先生から受け取った共有URLを開いてください。'},{status:401});
 const method=options.method??'GET';
 if(method==='GET')return send('rpc/vocab_snapshot',{method:'POST',body:'{}'});
 let body;try{body=JSON.parse(options.body??'{}');}catch{return Response.json({error:'回答の形式が正しくありません。'},{status:400});}
 if(method==='POST'){
  const data={event_id:body.eventId,card_id:body.cardId,session_id:body.sessionId,initial_remembered:Number(body.remembered),remembered:Number(body.remembered)};
  const r=await send('vocab_reviews?on_conflict=event_id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(data)});
  return r.ok?Response.json({ok:true}):Response.json({error:'記録を保存できませんでした。再試行してください。'},{status:r.status});
 }
 if(method==='PATCH'){
  const r=await send('vocab_reviews?event_id=eq.'+encodeURIComponent(body.eventId)+'&initial_remembered=eq.1',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({remembered:0,corrected:1})});
  if(!r.ok)return Response.json({error:'変更を保存できませんでした。再試行してください。'},{status:r.status});
  const rows=await r.json();return rows.length?Response.json({ok:true}):Response.json({error:'対象の回答が見つかりません。'},{status:404});
 }
 return Response.json({error:'Method not allowed'},{status:405});
}

function results(){const missed=s.deck.filter(c=>s.outcomes[c.id]===false);return `<section class="results panel"><span class="result-icon">${icon('checks',30)}</span><div class="eyebrow">SESSION COMPLETE</div><h1>今日の復習、おつかれさま。</h1><p>${s.deck.length}枚のカードを学習しました。記録は共有履歴に保存されています。</p><div class="result-stats"><div><b>${s.deck.length-missed.length}</b><span>覚えている</span></div><div><b>${missed.length}</b><span>覚えていない</span></div></div>${missed.length?`<h3>もう一度、見ておこう</h3><div class="result-words">${missed.map(c=>`<span>${esc(c.term)}</span>`).join('')}</div>${btn('redo',icon('rotate')+`この${missed.length}枚を復習する`)}`:''}${btn('home','学習トップへ戻る'+icon('arrow',17),'text-button')}</section>`;}
function words(){const p=progress();return `<div class="page-heading"><div class="eyebrow">YOUR WORD COLLECTION</div><h1>単語帳</h1><p>授業で出会った言葉を、意味ごとにまとめました。</p></div><section class="panel collection"><div class="collection-tools"><div class="search">${icon('search')}<input id="word-search" data-field="search" aria-label="単語を検索" placeholder="英語・日本語で検索" value="${esc(s.search)}"></div>${filters()}</div><div class="list-summary"><span><b>${listed().length}</b> 枚のカード</span>${!s.teacher?btn('start-list','この範囲を学習'+icon('arrow',16),'text-button',!listed().length||!s.snapshot||!!s.error):''}</div><div class="word-list">${listed().length?listed().map(c=>{const r=p.get(c.id);return `<article class="word-item"><button class="word-row" data-action="expand" data-value="${c.id}" aria-expanded="${s.expanded===c.id}"><div><b lang="en">${esc(c.term)}</b><span>${esc(c.meaning)}</span></div><div class="word-meta"><span class="status-badge ${!r?'unseen':r.remembered?'yes':'no'}">${!r?'未学習':r.remembered?'覚えている':'要復習'}</span>${icon('chevron',17,s.expanded===c.id?'rotate':'')}</div></button>${s.expanded===c.id?`<div class="word-detail"><p class="detail-example" lang="en">${mark(c.example)}</p><p>${esc(c.translation)}</p>${c.note?`<div class="note"><span>補足</span><p>${esc(c.note)}</p></div>`:''}<div class="word-detail-foot"><span>${refs(c)}</span>${r?`<span>学習 ${r.total}回 · 覚えていなかった ${r.missed}回</span>`:''}</div></div>`:''}</article>`;}).join(''):empty('該当するカードがありません','検索語や絞り込み条件を変えてみてください。')}</div></section>`;}
function historyView(){const ever=[...progress().values()].filter(p=>p.missed>0).length;const events=(s.snapshot?.history??[]).filter(e=>!s.historyMissed||!e.remembered);return `<div class="page-heading"><div class="eyebrow">YOUR LEARNING JOURNEY</div><h1>学習履歴</h1><p>思い出せた言葉も、これから覚える言葉も。</p></div><section class="history-stats"><div><span>累計の回答</span><b>${s.snapshot?s.snapshot.totals.total:'—'}<small>回</small></b></div><div><span>一度でも覚えていなかった</span><b>${s.snapshot?ever:'—'}<small>枚</small></b></div><div><span>答えを見て記録を変更</span><b>${s.snapshot?s.snapshot.totals.corrected:'—'}<small>回</small></b></div></section><section class="panel history-panel"><div class="section-heading"><h2>最近の記録</h2><label class="checkbox"><input type="checkbox" data-field="historyMissed" ${s.historyMissed?'checked':''}>覚えていなかった回答のみ</label></div><p class="muted">最新200件の回答を表示。累計と復習対象には、過去のすべての記録を含みます。</p>${!s.snapshot?empty('共有履歴を読み込み中','履歴の更新ボタンで再読み込みできます。'):events.length?`<div class="history-list">${events.map(e=>{const c=lookup.get(e.card_id);return `<div class="history-row"><span class="history-symbol ${e.remembered?'yes':'no'}">${icon(e.remembered?'check':'rotate',17)}</span><div class="history-word"><b>${esc(c?.term??'以前のカード')}</b><span>${esc(c?.meaning??'')}</span>${e.corrected?'<small>答えを見て「覚えていない」に変更</small>':''}</div><div class="history-time"><span>${e.remembered?'覚えている':'覚えていない'}</span><time>${stamp(e.created_at)}</time></div></div>`;}).join('')}</div>`:empty(s.historyMissed?'この範囲には記録がありません':'まだ学習記録がありません','カードを学習すると、ここに記録が残ります。')}</section>${btn('review',icon('rotate',22)+'<span>一度でも覚えていなかった単語を見る</span>'+icon('arrow'),'review-shortcut history-shortcut',false,'ever')}`;}
function render(){if(!s.cards.length){root.innerHTML=`<p style="padding:40px;color:#718567">${s.error?esc(s.error):'ことばノートを開いています…'}</p>`;return;}const focus=document.activeElement?.id;const caret=focus==='word-search'?document.activeElement.selectionStart:null;const names={learn:'今日の学習',words:'単語帳',history:'学習履歴'};root.innerHTML=`<div class="app-shell"><aside class="sidebar"><button class="brand" style="background:none;padding:0;color:inherit;text-align:left" data-action="tab" data-value="learn"><span class="brand-icon">${icon('book',22)}</span><span>ことばノート<small>ENGLISH STUDY NOTEBOOK</small></span></button><div class="sidebar-caption">MY NOTEBOOK</div><nav>${[['learn','book'],['words','library'],['history','history']].map(([t,i])=>btn('tab',icon(i,19)+`<span>${names[t]}</span>${s.tab===t?'<i></i>':''}`,'nav-item '+(s.tab===t?'selected':''),false,t).replace('<button ',`<button aria-label="${names[t]}" `)).join('')}</nav><div class="sidebar-bottom"><div class="little-book">${icon('leaf',23)}<p>間違えた言葉を、<br>わかる言葉に。</p><small>授業の続きを、少しずつ。</small></div>${btn('role',icon('cap',19)+`<span>${s.teacher?'先生ビュー':'生徒ビュー'}</span>`+icon('chevron',16),'role-button')}<p class="shared-note">生徒1人分の学習記録を共有中</p></div></aside><main><header class="topbar"><div class="breadcrumb">マイノート ${icon('chevron',13)} ${names[s.tab]}</div><div class="top-actions">${btn('role',s.teacher?'先生ビュー':'生徒ビュー','mobile-role')}${btn('refresh',icon('refresh',14,s.loading?'spin':'')+(s.loading?'読み込み中':s.error?'再読み込み':'履歴を更新'),'sync-button',s.loading)}</div></header>${s.teacher?`<div class="teacher-banner">${icon('cap')}<span>先生ビュー：単語と学習状況を確認できます。回答は記録しません。</span>${btn('role','生徒ビューへ','text-button')}</div>`:''}${s.error?`<div class="error-banner" role="alert">${esc(s.error)} ${s.snapshot?'表示中の履歴は更新前の内容です。':''}</div>`:''}<div class="content">${s.tab==='learn'?(active()?session():s.done?results():home()):s.tab==='words'?words():historyView()}<footer><span>${icon('book',14)}ことばノート</span><p>授業ノートから作った、例文付きの復習カード。<br class="mobile-break">例文は学習用に作成しています。</p></footer></div></main>${s.exit?`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="exit-title"><h2 id="exit-title">学習を終了しますか？</h2><p>保存済みの回答は履歴に残ります。</p>${s.saving||s.saveError?'<p class="warning">回答の保存を完了してから終了してください。</p>':''}<div>${btn('cancel-exit','学習を続ける','secondary')}${btn('end','終了する','primary',s.saving||!!s.saveError)}</div></div></div>`:''}</div>`;if(focus==='word-search'){const input=document.getElementById(focus);input?.focus();input?.setSelectionRange(caret,caret);}}
async function refresh(){const current=++seq;s.loading=true;render();try{const r=await notebookApi('/api/reviews',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(current===seq){s.snapshot=data;s.error='';}}catch{if(current===seq)s.error='共有履歴を読み込めませんでした。再読み込みしてください。';}finally{if(current===seq){s.loading=false;render();}}}
async function write(method,body){if(s.saving)return;s.saving=true;s.saveError='';s.pending={method,body};render();try{const r=await notebookApi('/api/reviews',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.error??'保存できませんでした。');}s.pending=null;await refresh();}catch(e){s.saveError=e.message??'保存できませんでした。再試行してください。';}finally{s.saving=false;render();}}
function start(custom){if(s.teacher||!s.snapshot||s.error)return;const cards=[...(custom??eligible())];if(!cards.length)return;for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}s.deck=cards.slice(0,s.count==='all'?undefined:Number(s.count));s.position=0;s.answer=null;s.done=false;s.outcomes={};s.saveError='';s.sessionId=crypto.randomUUID();s.eventId=crypto.randomUUID();s.tab='learn';render();window.scrollTo({top:0,behavior:'smooth'});}
root.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value;
 if(action==='refresh'){void refresh();return;}
 if(action==='tab'){if(active())s.exit=true;else s.tab=v;}
 if(action==='role'){if(active())s.exit=true;else{s.teacher=!s.teacher;window.history.replaceState({},'',location.pathname+(s.teacher?'?view=teacher':'')+location.hash);}}
 if(action==='review'){s.mode=v;s.tab='words';s.search='';}
 if(action==='expand')s.expanded=s.expanded===v?null:v;
 if(action==='start'){start();return;}
 if(action==='start-list'){start(listed());return;}
 if(action==='redo'){start(s.deck.filter(c=>s.outcomes[c.id]===false));return;}
 if(action==='home'){s.deck=[];s.done=false;}
 if(action==='exit')s.exit=true;
 if(action==='cancel-exit')s.exit=false;
 if(action==='end'){if(s.saving||s.saveError)return;s.deck=[];s.answer=null;s.done=false;s.exit=false;}
 if(action==='answer'){if(s.answer!==null||s.saving||s.teacher)return;const c=s.deck[s.position];s.answer=v==='yes';s.outcomes[c.id]=s.answer;void write('POST',{eventId:s.eventId,sessionId:s.sessionId,cardId:c.id,remembered:s.answer});return;}
 if(action==='correct'){if(s.answer!==true||s.saving||s.saveError)return;s.answer=false;s.outcomes[s.deck[s.position].id]=false;void write('PATCH',{eventId:s.eventId});return;}
 if(action==='retry'){if(s.pending)void write(s.pending.method,s.pending.body);return;}
 if(action==='next'){if(s.saving||s.saveError||s.answer===null)return;if(s.position+1>=s.deck.length)s.done=true;else{s.position++;s.answer=null;s.eventId=crypto.randomUUID();}}
 render();
});
root.addEventListener('change',event=>{const key=event.target.dataset.field;if(!key||key==='search')return;s[key]=event.target.type==='checkbox'?event.target.checked:event.target.value;render();});
root.addEventListener('input',event=>{if(event.target.dataset.field==='search'){s.search=event.target.value;render();}});
window.addEventListener('focus',()=>{if(!s.saving&&s.cards.length)void refresh();});
window.addEventListener('beforeunload',e=>{if(s.pending){e.preventDefault();e.returnValue='';}});
setInterval(()=>{if(!s.saving&&s.cards.length)void refresh();},30000);
notebookApi('/cards.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(cards=>{s.cards=cards;lookup=new Map(cards.map(c=>[c.id,c]));void refresh();}).catch(()=>{s.error='単語データを読み込めませんでした。ページを再読み込みしてください。';render();});
})();
</script></body></html>
